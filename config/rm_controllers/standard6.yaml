controllers:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100
  robot_state_controller:
    type: robot_state_controller/RobotStateController
    publish_rate: 200

  gimbal_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    velocity:
      joint: pitch_joint
      search_velocity: 6.28
      vel_threshold: 1e-2
      pid: { p: 0.3, i: 0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true }
  trigger_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    actuator: [ trigger_joint_motor ]
    velocity:
      joint: trigger_joint
      search_velocity: 3.1415
      vel_threshold: 0.2
      pid: { p: 0.3, i: 0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true }

  chassis_controller:
    type: rm_chassis_controllers/OmniController
    # ChassisBase
    publish_rate: 100
    publish_map_tf: false
    publish_odom_tf: true
    power:
      effort_coeff: 3.2
      vel_coeff: 0.2
      power_offset: 5.0
      use_rls: true
      use_K_angle: true
    raw_yaw_feedforward_k: -0.015
    twist_angular: 0.5233
    max_odom_vel: 10.0
    timeout: 0.1
    pid_follow: { p: 5.5, i: 0, d: 0.1, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
    twist_covariance_diagonal: [ 0.001, 0.001, 0.001, 0.001, 0.001, 0.001 ]

    # OmniController
    wheels:
      left_front:
        pose: [ 0.186, 0.186, 2.356 ]
        joint: left_front_wheel_joint
        <<: &wheel_setting
          roller_angle: 0.
          radius: 0.07625
          pid: { p: 0.25, i: 0, d: 0.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
      right_front:
        pose: [ 0.186, -0.186, 0.785 ]
        joint: right_front_wheel_joint
        <<: *wheel_setting
      left_back:
        pose: [ -0.186, 0.186, -2.356 ]
        joint: left_back_wheel_joint
        <<: *wheel_setting
      right_back:
        pose: [ -0.186, -0.186, -0.785 ]
        joint: right_back_wheel_joint
        <<: *wheel_setting

  orientation_controller:
    type: rm_orientation_controller/Controller
    publish_rate: 100
    name: "gimbal_imu"
    frame_source: "odom"
    frame_target: "base_link"

  gimbal_controller:
    type: rm_gimbal_controllers/DualYawController

    moment_of_inertia: 0.008
    track_solver_type: "external_mpc_aim"       # bullet_solver | external_mpc_aim
    external_mpc_aim_topic: "/sp_vision/mpc_gimbal_aim"
    external_aim_timeout: 0.1

    controllers:
      base_yaw:
        joint: "base_yaw_joint"
        pid: { p: 0.7, i: 0.0, d: 0.0, i_clamp_max: 2.0, i_clamp_min: -2.0, antiwindup: true, publish_state: true }
        pid_pos: { p: 20.0, i: 0, d: 1.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
      yaw:
        joint: "yaw_joint"
        pid: { p: 0.6, i: 15., d: 0.0, i_clamp_max: 0.1, i_clamp_min: -0.1, antiwindup: true, publish_state: true }
        pid_pos: { p: 25., i: 0, d: 0.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
        k_v: 1.0
        accel: 28.0
      pitch:
        joint: "pitch_joint"
        pid: { p: 1.0, i: 15.0, d: 0.0, i_clamp_max: 0.25, i_clamp_min: -0.25, antiwindup: true, publish_state: true }
        pid_pos: { p: 15.0, i: 0.0, d: 0.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
        k_v: 1.0
        accel: 40.0
    chassis_vel:
      num_data: 30
      debug: true
    imu_name: "gimbal_imu"
    feedforward:
      gravity: 13.0
      enable_gravity_compensation: false
      mass_origin: [0.155777, -0.008377, 0.00007]
    bullet_solver:
      resistance_coff_qd_10: 0.001
      resistance_coff_qd_15: 0.001
      resistance_coff_qd_16: 0.001
      resistance_coff_qd_18: 0.001
      resistance_coff_qd_30: 0.001
      resistance_coff_qd_800: 0.001
      g: 9.81
      delay: 0.02
      dt: 0.001
      timeout: 0.001
      publish_rate: 50
      max_track_target_vel: 10.0
      switch_hysteresis: 0.7
      max_chassis_angular_vel: 12.0
      track_rotate_target_delay: -0.02
      track_move_target_delay: 0.03
      center_delay: 0.104
      traject_k_vel_: 0.55
      switch_angle_offset: 0.7
      yaw_max_acc: 100.0
      traject_start_fit_: 40


  base_pitch_controller:
    type: effort_controllers/JointPositionController
    publish_rate: 100
    joint: "base_pitch_joint"
    pid: { p: 55.0, i: 0.0, d: 10.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true, publish_state: true }

  shooter_controller:
    type: rm_shooter_controllers/Controller
    publish_rate: 50
    friction:
      friction_left:
        left_friction_wheel:
          joint: "left_friction_wheel_joint"
          pid: { p: 0.0007, i: 0.005, d: 0.0, i_clamp_max: 0.01, i_clamp_min: -0.01, antiwindup: true, publish_state: true }
      friction_right:
        right_friction_wheel:
          joint: "right_friction_wheel_joint"
          pid: { p: 0.0007, i: 0.005, d: 0.0, i_clamp_max: 0.01, i_clamp_min: -0.01, antiwindup: true, publish_state: true }
          wheel_speed_direction: -1.0
    trigger:
      joint: "trigger_joint"
      pid: { p: 8, i: 0.0, d: 0.25, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true, publish_state: true }
    push_per_rotation: 8
    push_qd_threshold: 0.90
    block_effort: 1.2
    block_speed: 0.1
    block_duration: 0.1
    block_overtime: 0.25
    anti_block_angle: 0.26
    anti_block_threshold: 0.1
    forward_push_threshold: 0.28
    exit_push_threshold: 0.33
    wheel_speed_drop_threshold: 3.8
    wheel_speed_raise_threshold: 0.7
    freq_threshold: 20.0
