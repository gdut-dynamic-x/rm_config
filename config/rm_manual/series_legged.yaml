rm_manual:
  robot_type: "series_legged"
  dbus_topic: "/rm_ecat_hw/dbus"
  tof_topic: "/tof"
  chassis_calibrate_motor: [ "left_hip_motor", "right_hip_motor", "left_knee_motor", "right_knee_motor" ]
  gimbal_calibrate_motor: [ "" ]
  shooter_calibrate_motor: [ "trigger_joint_motor" ]
  supply_frame: "yaw"
  debug_gimbal_flag: false
  chassis:
    topic: "/cmd_chassis"
    accel_x:
      #      - [ 60.0,1.5 ]
      #      - [ 80.0,1.8 ]
      #      - [ 100.0,1.9 ]
      #      - [ 250.0,2.5 ]
      - [ 50.0,2.5 ]
    accel_y:
      - [ 60.0,3.0 ]
    accel_z:
      - [ 60.0,12.0 ]
      - [ 80.0,15.0 ]
      - [ 100.0,18.0 ]
      - [ 280.0,29.0 ]
    safety_power: 80
    capacitor_threshold: 0.1
    charge_power: 80
    extra_power: 0
    burst_power: 150
    standard_power: 85
    buffer_threshold: 10
    max_power_limit: 110
    minimum_power: 40
    power_gain: 0.0
    total_burst_time: 10
    is_new_capacitor: true
  balance:
    flank_frame: "flank_frame"
    reverse_frame: "yaw_reverse_frame"
    legged_wheel_chassis:
      topic: "/leg_cmd"
      unstick_topic: "/controllers/chassis_controller/unstick/two_leg_unstick"
      short_leg_length: 0.15
      mid_leg_length: 0.21
      high_leg_length: 0.348
  vel:
    topic: "/cmd_vel"
    power_limit_topic: "/cmd_chassis"
    max_linear_x:
      - [ 35.0,2.0 ]
      - [ 60.0,2.28 ]
      - [ 80.0,2.3 ]
    max_linear_y:
      - [ 35.0,2.3 ]
      - [ 60.0,2.35 ]
      - [ 80.0,2.4 ]
    max_angular_z:
      - [ 60.0,9.5 ]
      - [ 80.0,10.0 ]
      - [ 100.0,10.5 ]
    gyro_move_reduction: 0.5
    gyro_rotate_reduction: 1.0
  gimbal:
    topic: "/controllers/gimbal_controller/command"
    max_yaw_vel: 6.28
    max_pitch_vel: 5.0
    gimbal_scale: 10.0
    track_timeout: 0.5
    finish_turning_threshold: 2.9
    target_cost_function:
      k_pos: 1.0
      k_vel: 1.0
      k_hp: 1.0
      k_freq: 1.0
      timeout: 0.05
  shooter:
    topic: "/controllers/shooter_controller/command"
    track_armor_error_tolerance: 0.07
    untrack_armor_error_tolerance: 0.08
    max_track_target_vel: 11.0
    track_buff_error_tolerance: 0.12
    target_acceleration_tolerance: 99.0
    speed_10m_per_speed: 23.5
    speed_15m_per_speed: 23.5
    speed_16m_per_speed: 23.5
    speed_18m_per_speed: 23.5
    speed_30m_per_speed: 23.5
    wheel_speed_15: 680.0
    wheel_speed_18: 680.0
    wheel_speed_30: 680.0 # 715
    extra_wheel_speed_once: 5.0
    heat_limit:
      low_shoot_frequency: 10
      high_shoot_frequency: 10
      burst_shoot_frequency: 10
      minimal_shoot_frequency: 1.75
      safe_shoot_frequency: 3
      safe_speed_limit: 30
      heat_coeff: 5.0
      local_heat_protect_threshold: 40
      is_local: false
      type: "ID1_17MM"
  cover:
    topic: "/controllers/cover_controller/command"
    on_pos: -1.460
    off_pos: -0.02
  detection_switch:
    fail_limit: 10
    service_name: "/Processor/status_change"
  buff_switch:
    fail_limit: 10
    service_name: "/buff_status_switch"
  buff_type_switch:
    fail_limit: 10
    service_name: "/forecast/status_switch"
  exposure_switch:
    fail_limit: 10
    service_name: "/exposure_status_switch"

  controllers_list:
    state_controllers:
      - controllers/joint_state_controller
      - controllers/robot_state_controller
    main_controllers:
      - controllers/orientation_controller
      - controllers/chassis_controller
      - controllers/gimbal_controller
      - controllers/shooter_controller
    calibration_controllers:
      #      - controllers/gimbal_calibration_controller
      - controllers/trigger_calibration_controller

  chassis_calibration:
    - start_controllers:
        - ""
      stop_controllers:
        - ""
      services_name:
        - ""
  gimbal_calibration:
  shooter_calibration:
    - start_controllers:
        - controllers/trigger_calibration_controller
      stop_controllers:
        - controllers/shooter_controller
      services_name:
        - /controllers/trigger_calibration_controller/is_calibrated
