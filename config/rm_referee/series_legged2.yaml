rm_referee:
  robot_type: standard
  send_ui_queue_delay: 0.036
  add_ui_frequency: 0.5
  add_ui_max_times: 3
  dbus_topic: "/rm_ecat_hw/dbus"
  legged_chassis_status_topic: "/controllers/chassis_controller/legged_chassis_status"
  interactive_data:
  ui:
    trigger_change:
      - name: "chassis"
        config: { start_position: [ 100, 850 ], size: 15, width: 2, title: "chassis: " }
      - name: "gimbal"
        config: { start_position: [ 100, 800 ], size: 15, width: 2, title: "gimbal:  " }
      - name: "shooter"
        config: { start_position: [ 100, 750 ], size: 15, width: 2, title: "shooter: " }
      - name: "target"
        config: { start_position: [ 520, 820 ], size: 15, width: 2, title: "target: " }
      - name: "target_view_angle"
        config: { type: "rectangle", start_position: [ 500, 240 ], end_position: [ 1420,840 ], width: 3 }

    time_change:
      - name: "capacitor"
        config: { type: "line", width: 10, delay: 0.15,
                  start_position: [ 610, 100 ], end_position: [ 1210, 100 ] }
      - name: "rotation"
        config: { type: "arc", width: 4, delay: 0.15, color: "yellow",
                  start_position: [ 960, 520 ], end_position: [ 320, 320 ] , start_angle: 60, end_angle: 120 }
        data: { scale: 50, gimbal_reference_frame: "yaw", chassis_reference_frame: "base_link" }
      - name: "leg_theta_left"
        # Two-link leg visualization (chassis rectangle + 2 links).
        # Screen convention: origin at bottom-left; x right, y up; theta=0 points down; clockwise positive; [-pi, pi].
        config:
          { type: "line",
            color: "cyan",
            width: 4,
            delay: 0.15,
            # Optional overrides used by the implementation:
            chassis_color: "yellow" }
        data:
          { # Chassis rectangle (left = rear, right = front)
            chassis_start: [ 120, 660 ], chassis_end: [ 270, 720 ],
            link1_length: 0.218, link2_length: 0.26,
            pixels_per_meter: 500.0,
            leg_side: "left",
            draw_chassis: true }

      - name: "leg_theta_right"
        config:
          { type: "line",
            color: "cyan",
            width: 4,
            delay: 0.15,
            # Optional overrides used by the implementation:
            chassis_color: "yellow" }
        data:
          {
            chassis_start: [ 340, 660 ], chassis_end: [ 490, 720 ],
            link1_length: 0.218, link2_length: 0.26,
            pixels_per_meter: 500.0,
            # Read right leg from LeggedChassisStatus
            leg_side: "right",
            draw_chassis: true }

    fixed:
      - name: "capacity_boundary_l"
        config: { type: "line", width: 4, color: "green",
                  start_position: [ 610, 120 ], end_position: [ 610, 80 ] }
      - name: "capacity_boundary_r"
        config: { type: "line", width: 4, color: "green",
                  start_position: [ 1210, 120 ], end_position: [ 1210, 80 ] }
      - name: "3m"
        config: { type: "line", width: 2, color: "yellow",
                  start_position: [ 950, 505 ], end_position: [ 990, 505 ] }

    flash:
      - name: "capacity_run_out"
        config: { type: "string", start_position: [ 760, 320 ], size: 30, width: 4,
                  color: "pink", content: "capacity run out!!!", delay: 0.75 }
        data: { threshold_low: 0.15, threshold_high: 0.20 }
      - name: "armor0"
        config: { type: "circle", width: 3, radius: 50, color: "yellow", delay: 0.75 }
      - name: "armor1"
        config: { type: "circle", width: 3, radius: 50, color: "yellow", delay: 0.75 }
      - name: "armor2"
        config: { type: "circle", width: 3, radius: 50, color: "yellow", delay: 0.75 }
      - name: "armor3"
        config: { type: "circle", width: 3, radius: 50, color: "yellow", delay: 0.75 }
